<script>
    async function detectLocker() {
  // We use a real Google DoubleClick/AdSense script URL
  const targetUrl = 'https://googlesyndication.com';
  
  try {
    const response = await fetch(targetUrl, {
      method: 'HEAD', // HEAD request is lightweight and doesn't download the whole file
      mode: 'no-cors' // Crucial: prevents CORS errors from falsifying results
    });
    
    // If the request succeeds, no ad blocker is present
    console.log("No ad blocker detected.");
    return false;
  } catch (error) {
    // If uBlock Origin is active, the network request throws an exception immediately
    console.log("uBlock Origin (or another ad blocker) detected!");
    return true;
  }
}

// adblocker detection
detectLocker().then((isBlocked) => {
  if (isBlocked) {
    const popup = document.createElement('div');
    popup.style.position = 'fixed';
    popup.style.top = '0';
    popup.style.left = '0';
    popup.style.width = '100%';
    popup.style.height = '100%';
    popup.style.backgroundColor = 'rgba(0, 0, 0, 0.9)';
    popup.style.color = 'white';
    popup.style.display = 'flex';
    popup.style.justifyContent = 'center';
    popup.style.alignItems = 'center';
    popup.style.fontSize = '2em';
    popup.style.textAlign = 'center';
    popup.innerHTML = 'hello<br>i need you to disable your ad blocker to use the site';
    document.body.appendChild(popup);
  }
});
</script>
