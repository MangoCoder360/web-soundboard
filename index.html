<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <link href="/styles.css" rel="stylesheet">
    <script src="/script.js" defer></script>
    <title>web soundboard</title>
    <audio id="ui-sfx-player" hidden></audio>
</head>
<body onload="init()">
    <h1>soundboard balls</h1>
    <h2>my gyros: <span id="gyros-amount"></span></h2>
    <p>$5 per sound</p>
    <button onclick="getMoreGyros()">get more gyros</button>
    <button onclick="openSlotsUi()">go to the sl0ts machines</button><br><br><br>
    <div class="soundboard" aria-label="Soundboard">
        <button class="sound-button" type="button" onclick="playSound('/sfx/boom.mp3', this)">boom</button>
        <button class="sound-button" type="button" onclick="playSound('/sfx/fard.mp3', this)">fard</button>
        <button class="sound-button" type="button" onclick="playSound('/sfx/saul_goodman.mp3', this)">Saul Goodman</button>
        <button class="sound-button" type="button" onclick="playSound('/sfx/bababooey.mp3', this)">bababooey</button>
    </div>
</body>
<div id="slots-ui-container" style="display: none;">
    <iframe id="slots-ui" src="/slots.html"></iframe>
    <button onclick="closeSlotsUi()">quit while you're ahead</button>
</div>
<div id="ad" style="display: none;">
    <div id="ad-header"></div>
    <video id="ad-video"></video>
</div>
</html>
